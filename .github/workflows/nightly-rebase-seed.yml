# Nightly: the randomized rebase differential test with a new random seed each run.
# The seed shows in the test log ("differential seed ..."): replay it with GGUI_IR_SEED.
name: nightly-rebase-seed

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CPM_SOURCE_CACHE: ${{ github.workspace }}/.cache/CPM
  GGUI_TIMING_SLACK: "3"

jobs:
  rebase-seed:
    if: github.repository == 'rokups/GoodGit'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git ninja-build clang llvm lld pkg-config xvfb mesa-vulkan-drivers \
            libvulkan-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxi-dev libxss-dev libxfixes-dev libxtst-dev libwayland-dev libxkbcommon-dev \
            libdbus-1-dev libgtk-3-dev libssl-dev libdecor-0-dev
          echo "VK_DRIVER_FILES=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -n1)" >> "$GITHUB_ENV"
      - uses: actions/cache@v6
        with:
          path: .cache/CPM
          key: cpm-${{ runner.os }}-${{ hashFiles('cmake/**') }}
      - uses: actions/cache@v6 # fonts downloaded by cmake/Dependencies.cmake
        with:
          path: build/*/fonts
          key: fonts-${{ runner.os }}-${{ hashFiles('cmake/**') }}
      - name: Build
        run: |
          cmake --preset ninja
          cmake --build --preset ninja
      - name: Test (random seed)
        env:
          GGUI_TEST_ARTIFACTS: ${{ github.workspace }}/out/test-artifacts
        run: |
          export GGUI_IR_SEED=$(( (RANDOM << 30) ^ (RANDOM << 15) ^ RANDOM ))
          echo "GGUI_IR_SEED=$GGUI_IR_SEED"
          xvfb-run -a -s "-screen 0 1920x1080x24" \
            build/ninja/bin/ggui --test="in-memory engine vs git rebase"
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: rebase-seed-failures
          path: out/test-artifacts/
