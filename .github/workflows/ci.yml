# ggui CI (product spec §8.2, §8.3).
#
# Linux: Xvfb + software Vulkan (lavapipe), clang source-based coverage built once, the suite split
# into shards that download those binaries, git 2.36 (pinned minimum) and the distribution's latest
# git. Windows: MinGW-static and MSVC. Release packages: Linux tar.gz/zip/deb, MinGW and
# MSVC ZIPs, each checked by the package smoke scripts. No test may fail, on Linux (both git
# versions) or on either Windows toolchain. The coverage report is published but does not gate;
# COVERAGE_EXCL markers may not grow past the allowlist. Every shard runs with the UI-thread
# assertion on (the default in test builds).
# A green build of master replaces the "latest" pre-release's packages (the release job).
name: ci

on:
  push:
    branches: ["**"] # not tags: the release job moves the "latest" tag
  pull_request:

env:
  CPM_SOURCE_CACHE: ${{ github.workspace }}/.cache/CPM
  GGUI_FIXTURE_CACHE: ${{ github.workspace }}/.cache/ggui-fixtures
  SHARDS: "4"
  # Timing budgets (HIST-LOAD-FAST, the 33 ms frame limit, HOOK-FAST) x2 on shared runners with
  # software rendering and coverage; the release gate runs them unscaled (docs/release-checklist.md).
  GGUI_TIMING_SLACK: "2"

jobs:
  git-min:
    # Builds and caches git 2.36.0, the minimum supported version (G2).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/cache@v4
        id: cache
        with:
          path: ~/git-2.36
          key: git-2.36.0-ubuntu-24.04
      - if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev libexpat1-dev zlib1g-dev
          curl -sSLO https://mirrors.edge.kernel.org/pub/software/scm/git/git-2.36.0.tar.xz
          tar xf git-2.36.0.tar.xz && cd git-2.36.0
          make -j"$(nproc)" prefix="$HOME/git-2.36" NO_GETTEXT=1 NO_TCLTK=1 all install

  linux-build:
    # One instrumented build; every shard runs these binaries.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git ninja-build clang llvm lld pkg-config \
            libvulkan-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxi-dev libxss-dev libxfixes-dev libxtst-dev libwayland-dev libxkbcommon-dev \
            libdbus-1-dev libgtk-3-dev libssl-dev libdecor-0-dev
      - uses: actions/cache@v4
        with:
          path: .cache/CPM
          key: cpm-${{ runner.os }}-${{ hashFiles('cmake/Dependencies.cmake') }}
      - name: Build (clang, coverage)
        run: |
          cmake --preset coverage
          cmake --build --preset coverage
      # A tarball keeps the executable bits that upload-artifact drops.
      - run: tar -C build/coverage -cf linux-bin.tar bin
      - uses: actions/upload-artifact@v4
        with:
          name: linux-bin
          path: linux-bin.tar
          retention-days: 3

  linux:
    needs: [linux-build, git-min]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        git: [minimum, latest]
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies (runtime only)
        run: |
          sudo add-apt-repository -y ppa:git-core/ppa
          sudo apt-get update
          sudo apt-get install -y git xvfb mesa-vulkan-drivers libvulkan1 libx11-6 libxext6 \
            libxrandr2 libxcursor1 libxi6 libxss1 libxfixes3 libxkbcommon0 libdecor-0-0
          # lavapipe's ICD is lvp_icd.x86_64.json on older Mesa, lvp_icd.json from Mesa 25.
          echo "VK_DRIVER_FILES=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -n1)" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: ~/git-2.36
          key: git-2.36.0-ubuntu-24.04
      - if: matrix.git == 'minimum'
        run: echo "$HOME/git-2.36/bin" >> "$GITHUB_PATH"
      - run: git --version
      - uses: actions/cache@v4
        with:
          path: .cache/ggui-fixtures
          key: fixtures-large-v1
      - uses: actions/download-artifact@v4
        with:
          name: linux-bin
      - run: mkdir -p build/coverage && tar -C build/coverage -xf linux-bin.tar && rm linux-bin.tar
      - name: Tests (shard ${{ matrix.shard }}/4, Xvfb, lavapipe)
        env:
          LLVM_PROFILE_FILE: ${{ github.workspace }}/out/profiles/%p-%m.profraw
          GGUI_TEST_ARTIFACTS: ${{ github.workspace }}/out/test-artifacts
        run: |
          mkdir -p out/profiles
          xvfb-run -a -s "-screen 0 1920x1080x24" \
            build/coverage/bin/ggui --test --shard=${{ matrix.shard }}/$SHARDS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-${{ matrix.git }}-${{ matrix.shard }}
          path: out/
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: failures-${{ matrix.git }}-${{ matrix.shard }}
          path: out/test-artifacts/

  coverage:
    needs: linux
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y llvm
      - uses: actions/download-artifact@v4
        with:
          path: shards
      - name: Coverage report (informational; ggui + git-gg profiles merged; COVERAGE_EXCL allowlist)
        run: |
          tar -C shards -xf shards/linux-bin/linux-bin.tar
          bin=shards/bin
          llvm-profdata merge -sparse shards/linux-latest-*/profiles/*.profraw -o coverage.profdata
          llvm-cov export -format=lcov -instr-profile=coverage.profdata "$bin/ggui" -object "$bin/git-gg" \
            -ignore-filename-regex='(_deps|\.cache/CPM|generated|Source/tests)' > coverage.lcov
          python3 scripts/coverage_report.py --lcov coverage.lcov --root "$PWD" \
            --allowlist scripts/coverage_excl_allowlist.txt --out coverage.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: coverage.md

  # Windows: each toolchain is built once; its binaries run the suite in shards (like Linux).
  windows-build:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        toolchain: [mingw, msvc]
    steps:
      - uses: actions/checkout@v4
      - if: matrix.toolchain == 'mingw'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          path-type: inherit
          install: >-
            patch mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake mingw-w64-x86_64-ninja
      - if: matrix.toolchain == 'msvc'
        uses: ilammy/msvc-dev-cmd@v1
      - uses: actions/cache@v4
        with:
          path: .cache/CPM
          key: cpm-${{ matrix.toolchain }}-${{ hashFiles('cmake/Dependencies.cmake') }}
      - name: Build (mingw-x64-static)
        if: matrix.toolchain == 'mingw'
        shell: msys2 {0}
        env:
          CPM_SOURCE_CACHE: ${{ github.workspace }}/.cache/CPM
        run: |
          cmake --preset mingw-x64-static -DCPM_SOURCE_CACHE="$CPM_SOURCE_CACHE"
          cmake --build --preset mingw-x64-static
          mv build/mingw-x64-static/bin windows-bin
      - name: Build (msvc-x64)
        if: matrix.toolchain == 'msvc'
        shell: bash
        run: |
          cmake --preset msvc-x64 -DCPM_SOURCE_CACHE="${{ github.workspace }}/.cache/CPM"
          cmake --build --preset msvc-x64
          mv build/msvc-x64/bin windows-bin
      - uses: actions/upload-artifact@v4
        with:
          name: windows-bin-${{ matrix.toolchain }}
          path: windows-bin/
          retention-days: 3

  windows:
    needs: windows-build
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        toolchain: [mingw, msvc]
        shard: [0, 1, 2, 3]
    defaults:
      run:
        shell: bash # Git for Windows' bash; git is Git for Windows, as users have it
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-bin-${{ matrix.toolchain }}
          path: bin
      - uses: actions/cache@v4
        with:
          path: .cache/ggui-fixtures
          key: fixtures-large-v1-windows
      - run: git --version
      - name: Tests (shard ${{ matrix.shard }}/4, headless, D3D12/WARP)
        # A hang fails the job instead of holding the runner for the 6 h default.
        timeout-minutes: 30
        env:
          GGUI_HEADLESS: "1"
        run: |
          mkdir -p out
          bin/ggui.exe --test --shard=${{ matrix.shard }}/$SHARDS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-${{ matrix.toolchain }}-${{ matrix.shard }}
          path: |
            out/
            test-artifacts/


  # Release packages: release presets (no test engine), CPack, then the package
  # smoke checks. Packages are uploaded as artifacts.
  package-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git ninja-build pkg-config dpkg-dev desktop-file-utils unzip \
            mesa-vulkan-drivers libvulkan1 libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxi-dev libxss-dev libxfixes-dev libxtst-dev libwayland-dev libxkbcommon-dev \
            libdbus-1-dev libgtk-3-dev libssl-dev libdecor-0-dev
          # lavapipe's ICD is lvp_icd.x86_64.json on older Mesa, lvp_icd.json from Mesa 25.
          echo "VK_DRIVER_FILES=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -n1)" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: .cache/CPM
          key: cpm-${{ runner.os }}-${{ hashFiles('cmake/Dependencies.cmake') }}
      - name: Build, package and check (tar.gz, zip, deb; deb installed with apt in a clean container)
        run: scripts/package_smoke.sh --container ubuntu:24.04
      - uses: actions/upload-artifact@v4
        with:
          name: package-linux
          path: |
            build/packages/*.tar.gz
            build/packages/*.zip
            build/packages/*.deb

  package-mingw:
    runs-on: windows-2022
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: >-
            git patch unzip mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake mingw-w64-x86_64-ninja
            mingw-w64-x86_64-python
      - uses: actions/cache@v4
        with:
          path: .cache/CPM
          key: cpm-mingw-${{ hashFiles('cmake/Dependencies.cmake') }}
      - name: Build and package (mingw-x64-static-release)
        env:
          CPM_SOURCE_CACHE: ${{ github.workspace }}/.cache/CPM
        run: |
          cmake --preset mingw-x64-static-release -DCPM_SOURCE_CACHE="$CPM_SOURCE_CACHE"
          cmake --build --preset mingw-x64-static-release
          cpack --preset package-mingw
      - name: Check the package
        run: scripts/package_smoke_windows.sh build/packages/ggui-*-windows-x64-mingw.zip
      - uses: actions/upload-artifact@v4
        with:
          name: package-mingw
          path: build/packages/*.zip

  package-msvc:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: actions/cache@v4
        with:
          path: .cache/CPM
          key: cpm-msvc-${{ hashFiles('cmake/Dependencies.cmake') }}
      - name: Build and package (msvc-x64-release)
        run: |
          cmake --preset msvc-x64-release -DCPM_SOURCE_CACHE="${{ github.workspace }}/.cache/CPM"
          cmake --build --preset msvc-x64-release
          cpack --preset package-msvc
      - name: Check the package (Git Bash)
        shell: bash
        run: scripts/package_smoke_windows.sh build/packages/ggui-*-windows-x64-msvc.zip
      - uses: actions/upload-artifact@v4
        with:
          name: package-msvc
          path: build/packages/*.zip

  # The "latest" pre-release: on master, once every build, test, coverage and package job passed,
  # its tag moves to this commit and its assets are replaced with this build's packages.
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [linux, coverage, windows, package-linux, package-mingw, package-msvc]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: release-latest
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: dist
          merge-multiple: true
      - name: Update the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ls -l dist
          git tag -f latest "$GITHUB_SHA"
          git push -f origin refs/tags/latest
          notes="Built by CI from master at ${GITHUB_SHA::7} (all tests passed). Replaced on every successful master build."
          if ! gh release view latest >/dev/null 2>&1; then
            gh release create latest --prerelease --title "Latest build" --notes "$notes" --target "$GITHUB_SHA"
          fi
          # Old packages go (their names carry the version), this build's come in.
          gh release view latest --json assets -q '.assets[].name' | while read -r asset; do
            gh release delete-asset latest "$asset" --yes
          done
          gh release upload latest dist/* --clobber
          gh release edit latest --prerelease --title "Latest build" --notes "$notes"
